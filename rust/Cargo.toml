[package]
name = "greenbook"
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0"
description = "Computable, versioned UK childhood immunisation schedule (Green Book) and FHIR vaccination evaluator"
repository = "https://github.com/bawmedical/greenbook"
readme = "README.md"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"
thiserror = "2.0.18"
clap = { version = "4.6.1", features = ["derive"] }

[[bin]]
name = "greenbook"
path = "src/bin/greenbook.rs"
