# Serve the built documentation site (which includes the demo and presentation)
# locally, in one small nginx container. The site is produced by `zensical build`
# into ./site; `s/up` runs that build first. For live-reload editing of the docs,
# prefer `s/docs` (zensical serve) instead.
#
# Start it:   s/up            (builds the site, then: docker compose up)
# Then open:  http://localhost:8080/   (demo at /demo/, presentation at /presentation/)
# Stop it:    Ctrl+C          (or: docker compose down)

services:
  web:
    image: nginx:1.30.2-alpine   # pinned stable; bump deliberately
    container_name: greenbook
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
