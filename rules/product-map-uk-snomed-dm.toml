# Product-to-antigen mapping for UK SNOMED drug extension codes.
# Each entry maps a product SNOMED code to:
#   - product_class: the conformance class the Green Book names (drives series
#     matching — see spec/conformance-vs-coverage.md)
#   - antigens: the diseases the product covers (for the deferred coverage view)

coding_system = "snomed-uk-dm"
coding_system_url = "https://snomed.info/sct"
last_verified = "2026-06-27"
verification_notes = "Concept IDs checked with sct against UK SNOMED release uk_sct2mo_42.2.0_20260603000001z."

[[product]]
code = "13082601000001103"
display = "Infanrix Hexa (product)"
product_class = "6-in-1"
antigens = ["diphtheria", "tetanus", "pertussis", "polio", "hib", "hepatitis-b"]

