<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>greenbook - schedule evaluation demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar: scenario presets (our test fixtures). Built for a future
         "Custom patient" mode that sets the same record state. -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">greenbook</div>
        <div class="brand-sub">schedule evaluation engine</div>
      </div>

      <div class="side-section">
        <div class="side-label">View</div>
        <div class="view-toggle" id="viewToggle">
          <button class="vt-btn active" data-view="dashboard">Dashboard</button>
          <button class="vt-btn" data-view="timeline">Timeline</button>
        </div>
      </div>

      <div class="side-section">
        <div class="side-label">Scenario</div>
        <div id="presetList" class="preset-list"></div>
      </div>

      <div class="side-section">
        <div class="side-label">Custom patient</div>
        <button class="preset" data-id="__custom__">
          <span class="preset-name">Build your own</span>
          <span class="preset-hint">Set age &amp; doses, watch it update</span>
        </button>
      </div>

      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <!-- Main dashboard -->
    <main class="main">
      <header class="topbar" id="topbar"></header>
      <section class="builder" id="builder"></section>
      <section class="kpis" id="kpis"></section>
      <section class="panels" id="panels"></section>
      <section class="timeline" id="timeline"></section>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
