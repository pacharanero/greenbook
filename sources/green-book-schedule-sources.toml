# Historical Green Book schedule source documents.
#
# These entries are source-document metadata only. The PDFs themselves download
# to pdf/ via s/download-green-book.sh, and pdf/*.pdf is intentionally ignored.
# This list covers the 2006 whole-book edition and the GOV.UK Chapter 11 era,
# beginning with first online Chapter 11 publication on 2013-03-20. The 1992
# and 1996 printed editions, plus predecessor schedule documents, still need a
# targeted archival/library search.

